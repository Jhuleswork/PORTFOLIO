<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#08090d">
  <title>Jhules Bryan Awali | Portfolio</title>
  <style>
    html, body, iframe { width: 100%; height: 100%; margin: 0; border: 0; }
    iframe { display: block; }
  </style>
</head>
<body>
  <iframe id="portfolio" src="index%20(1).html" title="Jhules Bryan Awali portfolio"></iframe>
  <script>
    document.getElementById('portfolio').addEventListener('load', function () {
      const page = this.contentDocument;
      const avatar = page && page.querySelector('.avatar');
      if (!avatar) return;

      const photo = page.createElement('img');
      photo.src = 'DP.png';
      photo.alt = 'Jhules Bryan Awali profile photo';
      photo.style.cssText = 'position:relative;z-index:2;width:150px;height:150px;object-fit:cover;border-radius:50%;border:2px solid rgba(255,255,255,.35);box-shadow:0 12px 35px rgba(0,0,0,.35)';
      avatar.replaceChildren(avatar.querySelector('.avatar-glow'), photo);
    });
  </script>
</body>
</html>
